<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Carte éditoriale  wilayas touchées par les incendies (juillet 2026)</title>
  <desc id="desc">Carte schématique des wilayas citées dans les bilans de la Protection civile. Ne remplace pas une cartographie officielle.</desc>
  <rect width="1400" height="900" fill="#f4f6f3"/>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dde3d9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="900" fill="url(#g)" opacity="0.5"/>
  <rect x="72" y="64" width="820" height="120" rx="24" fill="#fff" stroke="rgba(0,0,0,.08)"/>
  <text x="104" y="118" font-family="Georgia, serif" font-size="36" fill="#0a0a0a">Wilayas citées  juillet 2026</text>
  <text x="104" y="158" font-family="Arial, sans-serif" font-size="18" fill="#5f6660">Schéma éditorial · sources Protection civile / presse · mise à jour 2223 juil. 2026</text>

  <!-- Schematic northern band -->
  <rect x="72" y="220" width="1256" height="520" rx="28" fill="#fff" stroke="rgba(0,0,0,.08)"/>
  <text x="104" y="270" font-family="Arial, sans-serif" font-size="14" fill="#006233" letter-spacing="2">NORD MÉDITERRANÉEN (schéma)</text>

  <!-- Hotspots -->
  <g font-family="Arial, sans-serif">
    <circle cx="980" cy="340" r="28" fill="#d21034" opacity="0.85"/>
    <text x="1020" y="348" font-size="20" fill="#0a0a0a">Annaba / Seraïdi</text>
    <text x="1020" y="372" font-size="14" fill="#5f6660">foyer critique · hôpital évacué</text>

    <circle cx="860" cy="380" r="18" fill="#c45c26"/>
    <text x="890" y="386" font-size="16" fill="#0a0a0a">Skikda · El Tarf · Guelma · Souk Ahras</text>

    <circle cx="720" cy="400" r="16" fill="#c45c26"/>
    <text x="748" y="406" font-size="16" fill="#0a0a0a">Jijel · Béjaïa · Mila · Constantine</text>

    <circle cx="560" cy="430" r="14" fill="#b8860b"/>
    <text x="586" y="436" font-size="16" fill="#0a0a0a">Bouira · Boumerdès · Médéa</text>

    <circle cx="380" cy="450" r="14" fill="#b8860b"/>
    <text x="406" y="456" font-size="16" fill="#0a0a0a">Tlemcen · Mascara · Saïda</text>

    <circle cx="240" cy="520" r="12" fill="#6b7280"/>
    <text x="264" y="526" font-size="15" fill="#5f6660">Timimoun (foyer signalé)</text>
  </g>

  <g transform="translate(104,680)" font-family="Arial, sans-serif" font-size="14">
    <circle cx="8" cy="-4" r="8" fill="#d21034"/><text x="28" y="0" fill="#0a0a0a">Critique / priorité locale</text>
    <circle cx="280" cy="-4" r="8" fill="#c45c26"/><text x="300" y="0" fill="#0a0a0a">Foyers actifs cités</text>
    <circle cx="520" cy="-4" r="8" fill="#b8860b"/><text x="540" y="0" fill="#0a0a0a">Interventions / surveillance</text>
  </g>
  <text x="104" y="760" font-family="Arial, sans-serif" font-size="13" fill="#5f6660">Carte non officielle. Les effectifs de feux évoluent heure par heure ; se référer aux bilans DGPC.</text>
  <text x="104" y="788" font-family="Arial, sans-serif" font-size="13" fill="#5f6660">Viva Algérie · graphique éditorial original</text>
</svg>
