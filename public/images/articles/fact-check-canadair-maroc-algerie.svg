<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Fact-check — Canadair marocains en Algérie</title>
  <desc id="desc">Carte de vérification : confirmation éditoriale Viva Algérie, confirmation étatique, preuve visuelle, verdict.</desc>
  <rect width="1400" height="820" fill="#f4f6f3"/>
  <rect x="72" y="48" width="1050" height="110" rx="24" fill="#fff" stroke="rgba(0,0,0,.08)"/>
  <text x="104" y="100" font-family="Georgia, serif" font-size="34" fill="#0a0a0a">Fact-check Canadair Maroc / Algérie</text>
  <text x="104" y="136" font-family="Arial, sans-serif" font-size="16" fill="#5f6660">Affirmation : « Des Canadair marocains sont intervenus en Algérie. »</text>

  <g font-family="Arial, sans-serif">
    <rect x="72" y="200" width="600" height="160" rx="20" fill="#fff" stroke="#006233" stroke-width="2"/>
    <text x="104" y="248" font-size="14" fill="#006233" letter-spacing="1">CONFIRMATION ÉDITORIALE</text>
    <text x="104" y="286" font-size="18" fill="#0a0a0a">Oui — confirmé par</text>
    <text x="104" y="316" font-size="16" fill="#5f6660">la rédaction de Viva Algérie</text>

    <rect x="712" y="200" width="600" height="160" rx="20" fill="#fff" stroke="#b8860b" stroke-width="2"/>
    <text x="744" y="248" font-size="14" fill="#b8860b" letter-spacing="1">CONFIRMATION ÉTATIQUE</text>
    <text x="744" y="286" font-size="18" fill="#0a0a0a">Non attribuée ici</text>
    <text x="744" y="316" font-size="16" fill="#5f6660">(pas de communiqué DZ/MA cité)</text>

    <rect x="72" y="400" width="600" height="160" rx="20" fill="#fff" stroke="#b8860b" stroke-width="2"/>
    <text x="104" y="448" font-size="14" fill="#b8860b" letter-spacing="1">PREUVE VISUELLE PUBLIQUE</text>
    <text x="104" y="486" font-size="18" fill="#0a0a0a">À compléter</text>
    <text x="104" y="516" font-size="16" fill="#5f6660">(tracking / images datées)</text>

    <rect x="712" y="400" width="600" height="160" rx="20" fill="#f3faf5" stroke="#006233" stroke-width="2"/>
    <text x="744" y="448" font-size="14" fill="#006233" letter-spacing="1">VERDICT</text>
    <text x="744" y="486" font-size="22" fill="#0a0a0a">Confirmé par Viva Algérie</text>
    <text x="744" y="520" font-size="16" fill="#5f6660">source : rédaction</text>
  </g>

  <rect x="72" y="600" width="1240" height="140" rx="20" fill="#fff" stroke="rgba(0,0,0,.08)"/>
  <text x="104" y="652" font-family="Arial, sans-serif" font-size="16" fill="#0a0a0a">Renfort aérien marocain + mobilisation algérienne : effort combiné, pas une extinction unilatérale.</text>
  <text x="104" y="686" font-family="Arial, sans-serif" font-size="15" fill="#5f6660">Source : Viva Algérie — informations propres à la rédaction.</text>
  <text x="104" y="716" font-family="Arial, sans-serif" font-size="14" fill="#5f6660">Graphique éditorial Viva Algérie — mise à jour 23 juillet 2026</text>
</svg>
