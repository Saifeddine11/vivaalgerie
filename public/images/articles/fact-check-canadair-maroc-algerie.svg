<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Fact-check  Canadair marocains en Algérie</title>
  <desc id="desc">Carte de vérification : information éditoriale, confirmation officielle, preuve indépendante, verdict.</desc>
  <rect width="1400" height="820" fill="#f4f6f3"/>
  <rect x="72" y="48" width="980" height="110" rx="24" fill="#fff" stroke="rgba(0,0,0,.08)"/>
  <text x="104" y="100" font-family="Georgia, serif" font-size="34" fill="#0a0a0a">Fact-check Canadair Maroc / Algérie</text>
  <text x="104" y="136" font-family="Arial, sans-serif" font-size="16" fill="#5f6660">Affirmation : « Des Canadair marocains sont intervenus en Algérie. »</text>

  <g font-family="Arial, sans-serif">
    <rect x="72" y="200" width="600" height="160" rx="20" fill="#fff" stroke="#006233" stroke-width="2"/>
    <text x="104" y="248" font-size="14" fill="#006233" letter-spacing="1">INFORMATION ÉDITORIALE</text>
    <text x="104" y="286" font-size="18" fill="#0a0a0a">Oui  témoignage direct transmis</text>
    <text x="104" y="316" font-size="16" fill="#5f6660">à la rédaction de Viva Algérie</text>

    <rect x="712" y="200" width="600" height="160" rx="20" fill="#fff" stroke="#b8860b" stroke-width="2"/>
    <text x="744" y="248" font-size="14" fill="#b8860b" letter-spacing="1">CONFIRMATION OFFICIELLE</text>
    <text x="744" y="286" font-size="18" fill="#0a0a0a">Non trouvée au moment</text>
    <text x="744" y="316" font-size="16" fill="#5f6660">de la publication (DZ / MA)</text>

    <rect x="72" y="400" width="600" height="160" rx="20" fill="#fff" stroke="#b8860b" stroke-width="2"/>
    <text x="104" y="448" font-size="14" fill="#b8860b" letter-spacing="1">PREUVE INDÉPENDANTE</text>
    <text x="104" y="486" font-size="18" fill="#0a0a0a">Non vérifiée (tracking,</text>
    <text x="104" y="516" font-size="16" fill="#5f6660">communiqué, géolocalisation)</text>

    <rect x="712" y="400" width="600" height="160" rx="20" fill="#fff8f0" stroke="#c45c26" stroke-width="2"/>
    <text x="744" y="448" font-size="14" fill="#c45c26" letter-spacing="1">VERDICT</text>
    <text x="744" y="486" font-size="22" fill="#0a0a0a">Rapporté par Viva Algérie</text>
    <text x="744" y="520" font-size="16" fill="#5f6660">plausible mais non vérifié</text>
  </g>

  <rect x="72" y="600" width="1240" height="140" rx="20" fill="#fff" stroke="rgba(0,0,0,.08)"/>
  <text x="104" y="652" font-family="Arial, sans-serif" font-size="16" fill="#0a0a0a">Ne pas confondre contribution rapportée, maîtrise dun foyer et extinction nationale.</text>
  <text x="104" y="686" font-family="Arial, sans-serif" font-size="15" fill="#5f6660">Les moyens algériens (Protection civile, ANP, forestiers, volontaires, aéronefs nationaux) restent centraux.</text>
  <text x="104" y="716" font-family="Arial, sans-serif" font-size="14" fill="#5f6660">Graphique éditorial Viva Algérie  23 juillet 2026</text>
</svg>
